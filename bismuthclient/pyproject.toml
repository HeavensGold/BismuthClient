[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bismuthclient"
version = "0.0.53"
description = "Bismuth python library to be used by dApps and clients."
readme = "README.rst"
license = {text = "MIT"}
authors = [
    {name = "EggdraSyl Bismuth Foundation", email = "dev@eggpool.net"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["bismuthclient"]
requires-python = ">=3.5"
dependencies = [
    "polysign @ git+https://github.com/HeavensGold/polysign.git#subdirectory=polysign",
    "pycryptodomex",
    "requests"
]

[project.urls]
Homepage = "https://github.com/BismuthFoundation/bismuthclient"
Repository = "https://github.com/BismuthFoundation/bismuthclient"

[project.optional-dependencies]
dev = [
    "pip==19.2",
    "bumpversion==0.5.3",
    "wheel==0.32.1",
    "watchdog==0.9.0",
    "flake8==3.5.0",
    "tox==3.5.2",
    "coverage==4.5.1",
    "Sphinx==1.8.1",
    "twine==1.12.1",
    "pytest==3.8.2",
    "pytest-runner==4.2"
]

[tool.setuptools]
packages = ["bismuthclient"]
include-package-data = true
zip-safe = false